<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#13141c" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <title>Picord</title>
        <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261124c" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261124c" sizes="any" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20261124c" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261124c" />
        <link rel="preload" href="/style.css" as="style" />
        <!--
            The cascade layers, in the order they win: the app's own CSS and extensions' (pocket), the colors chosen in
            Appearance (palette), then the theme (theme.js). Sizes people choose stay inline and win over all three, unless a
            theme marks a size !important, which themes must not do.
        -->
        <style>
            @layer pocket, palette, theme;
            @import url("/style.css") layer(pocket);
        </style>
        <!--
            The last look this browser used (theme.js keeps it), before the first paint: no flash of another theme. The
            theme's stylesheets are written into the page, so it waits for them as for a <link>; not in safe mode
            (safe-mode.js), and only addresses of theme files. The fonts to preload: a theme's own, else the app's.
        -->
        <script>
            (function () {
                var fonts = ["/fonts/Geist.woff2", "/fonts/JetBrainsMono.woff2"];
                var sheets = [];
                try {
                    var look = JSON.parse(localStorage.getItem("pocket.themeCache") || "null");
                    if (look) {
                        var root = document.documentElement;
                        var light =
                            look.pair && matchMedia("(prefers-color-scheme: light)").matches;
                        var chosen = look.pair ? look.pair[light ? "light" : "dark"] : look;
                        var colors = "";
                        for (var name in chosen.palette)
                            colors += name + ":" + chosen.palette[name] + ";";
                        var palette = document.createElement("style");
                        palette.id = "pocket-palette";
                        palette.textContent = "@layer palette{:root{" + colors + "}}";
                        document.head.appendChild(palette);
                        var query = new URLSearchParams(location.search);
                        var safe = query.has("noext")
                            ? !/^(0|false|off|no)$/i.test(query.get("noext").trim())
                            : sessionStorage.getItem("pocket.noext") === "1";
                        if (!safe) {
                            sheets = (look.css || []).filter(function (url) {
                                return /^\/themes\/[a-z0-9][a-z0-9-]{1,47}\/[A-Za-z0-9_-]{12}\/theme\.css$/.test(
                                    url,
                                );
                            });
                            var own = (look.fonts || []).filter(function (url) {
                                // Its own fonts, or the app's that it names (/fonts/…).
                                return /^(\/themes\/[a-z0-9][a-z0-9-]{1,47}\/[A-Za-z0-9_-]{12}\/([A-Za-z0-9_-][A-Za-z0-9._-]*\/)*[A-Za-z0-9_-][A-Za-z0-9._-]*|\/fonts\/[A-Za-z0-9_-]+)\.woff2$/.test(
                                    url,
                                );
                            });
                            if (sheets.length > 0 && own.length > 0) fonts = own;
                        }
                        for (var each in look.vars) root.style.setProperty(each, look.vars[each]);
                        for (var key in look.attrs) root.dataset[key] = look.attrs[key];
                        if (look.pair) root.dataset.mode = light ? "light" : "dark";
                        document
                            .querySelector('meta[name="theme-color"]')
                            .setAttribute("content", chosen.color || look.vars["--o-bg"]);
                    }
                } catch (error) {}
                document.write(
                    fonts
                        .map(function (url) {
                            return (
                                '<link rel="preload" href="' +
                                url +
                                '" as="font" type="font/woff2" crossorigin>'
                            );
                        })
                        .join("") +
                        (sheets.length > 0
                            ? "<style id='pocket-theme' data-urls='" +
                              JSON.stringify(sheets) +
                              "'>" +
                              sheets
                                  .map(function (url) {
                                      return '@import url("' + url + '") layer(theme);';
                                  })
                                  .join("") +
                              "</style>"
                            : ""),
                );
            })();
        </script>
        <script type="importmap">
            {
                "imports": {
                    "preact": "/vendor/preact.mjs",
                    "preact/hooks": "/vendor/preact-hooks.mjs",
                    "htm": "/vendor/htm.mjs",
                    "marked": "/vendor/marked.mjs",
                    "dompurify": "/vendor/purify.mjs"
                }
            }
        </script>
    </head>
    <body>
        <!-- The same boot screen the app shows while it starts (Boot in ui.js), so nothing jumps when the script takes over. -->
        <div id="app">
            <div class="boot" data-part="boot" role="status">
                <div class="boot-mark" data-part="brand-mark" aria-hidden="true">
                    <svg width="64" height="56" viewBox="0 10 68 54" fill="currentColor" style="display: block;">
                        <path fill-rule="evenodd" d="M 56.4 16.3 C 52.2 14.3 47.6 13 42.8 12.1 C 42.1 13.4 41.3 15.1 40.7 16.6 C 35.6 15.8 30.4 15.8 25.3 16.6 C 24.7 15.1 23.9 13.4 23.2 12.1 C 18.4 13 13.8 14.3 9.6 16.3 C 0.9 29.3 -1.4 42 0.8 54.4 C 6.5 58.7 12.1 61.3 17.5 63 C 18.9 61.1 20.1 59.1 21.2 56.9 C 19.2 56.1 17.4 55.1 15.6 53.9 C 16.1 53.5 16.5 53.1 17 52.8 C 27.6 57.7 39 57.7 49.5 52.8 C 49.9 53.1 50.4 53.5 50.8 53.9 C 49 55.1 47.2 56.1 45.3 56.9 C 46.4 59.1 47.6 61.1 49 63 C 54.5 61.3 60.1 58.7 65.7 54.4 C 68.3 39.5 64.3 26.8 56.4 16.3 Z M 16 30.5 C 18.5 30.5 20.5 33 20.5 36 C 20.5 39 18.5 41.5 16 41.5 C 13.5 41.5 11.5 39 11.5 36 C 11.5 33 13.5 30.5 16 30.5 Z M 50 30.5 C 52.5 30.5 54.5 33 54.5 36 C 54.5 39 52.5 41.5 50 41.5 C 47.5 41.5 45.5 39 45.5 36 C 45.5 33 47.5 30.5 50 30.5 Z M 23 23 C 25 21.6 28.5 20.8 33 20.8 C 37.5 20.8 41 21.6 43 23 C 42.2 24.1 40.5 24.8 38 24.8 L 28 24.8 C 25.5 24.8 23.8 24.1 23 23 Z M 26.5 24.8 L 30.5 24.8 L 30.5 45.8 L 26.5 45.8 Z M 35.5 24.8 L 39.5 24.8 L 39.5 39 C 39.5 42 40.8 43.2 43 43.2 C 44 43.2 45 42.6 45.6 41.6 L 46.5 42.6 C 45.3 44.1 43.8 44.8 42 44.8 C 38 44.8 35.5 42.2 35.5 39 Z" />
                    </svg>
                </div>
                <div class="boot-bar" aria-hidden="true"><span></span></div>
                <div class="boot-caption">starting</div>
            </div>
        </div>
        <!--
            A file of the app that does not load (a content blocker, the network) or that fails as it runs stops the app
            before it can say so, and the boot screen stays up: say it here, until the app's script has run.
        -->
        <script>
            (function () {
                var fail = function (detail) {
                    var boot = document.querySelector("#app > .boot");

                    if (!boot) {
                        return;
                    }

                    // A signed-in page waits out its device-cache check hidden. A startup failure must still show.
                    boot.parentElement.hidden = false;
                    boot.classList.add("failed");
                    boot.querySelector(".boot-caption").textContent = "could not start";

                    var line = boot.querySelector(".boot-detail") || document.createElement("div");

                    line.className = "boot-detail";
                    line.textContent = detail;
                    boot.appendChild(line);
                };
                var watch = function (event) {
                    var target = event.target;
                    var app =
                        target &&
                        target.tagName === "SCRIPT" &&
                        target.getAttribute("src") === "/app.js";

                    if (event.type === "load") {
                        if (app) {
                            removeEventListener("error", watch, true);
                            document.removeEventListener("load", watch, true);
                        }
                    } else if (app) {
                        fail(
                            "A file of the app did not load. A content blocker can stop one: " +
                                "let this address through it, then reload.",
                        );
                    } else if (event instanceof ErrorEvent) {
                        fail(
                            "A file of the app failed: " + event.message + " Reload to try again.",
                        );
                    }
                };

                addEventListener("error", watch, true);
                document.addEventListener("load", watch, true);
            })();
        </script>
        <script type="module" src="/app.js"></script>
    </body>
</html>
